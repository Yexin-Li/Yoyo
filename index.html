.wp{display:flex;flex-direction:column;gap:14px;padding-bottom:8px}
.wp button,.wp select,.wp textarea{font:inherit}
.wp button,.wp summary,.wp select{touch-action:manipulation}
.wp-hero{padding:20px 22px;background:#E8EEE5;border-radius:24px;color:#354F43;overflow:hidden}
.wp-kicker{font-size:11px;letter-spacing:.12em;font-weight:650;display:flex;justify-content:space-between;gap:8px}
.wp-kicker span{letter-spacing:.02em;font-weight:400;color:#627967}
.wp-heading{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:12px 0}
.wp-heading h2{font-family:var(--display);font-size:28px;line-height:1.35;letter-spacing:.03em;margin:0;font-weight:650}
.wp-art{width:95px;flex:none;transform:rotate(-5deg)}
.wp-hero>p{font-size:13px;line-height:1.85;margin:0;color:#576E5E}
.wp-options{background:#fff;border:1px solid var(--line);border-radius:17px;padding:0 16px}
.wp summary{cursor:pointer;list-style:none}
.wp summary::-webkit-details-marker{display:none}
.wp summary:focus-visible,.wp button:focus-visible{outline:2px solid var(--teal);outline-offset:4px}
.wp-options>summary{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:52px;font-size:13px;font-weight:600}
.wp-options>summary span{font-size:11px;font-weight:400;color:#766970;text-align:right}
.wp-options>summary::after{content:'+';font-size:20px;color:var(--soft)}
.wp-options[open]>summary::after{content:'\u2212'}
.wp-settings{border-top:1px solid var(--line);padding:15px 0;display:grid;gap:16px}
.wp-settings>label{font-size:12px;display:grid;gap:8px;color:#74626C}
.wp-settings select{width:100%;height:44px;padding:8px 10px;border-radius:10px;border:1px solid #D9CEC9;background:var(--paper);color:var(--ink);font-size:14px}
.wp-settings>.wp-toggle{display:flex;justify-content:space-between;align-items:center;min-height:44px;font-size:13px;color:var(--ink)}
.wp-toggle small{display:block;font-size:11px;color:#82747C;margin-top:5px}
.wp-toggle input{width:22px;height:22px;accent-color:var(--teal)}
.wp-day-tabs{display:flex;gap:6px;background:#EFE6DF;border-radius:15px;padding:5px;margin-top:5px}
.wp-day-tabs button{border:0;background:transparent;flex:1;display:flex;gap:10px;align-items:center;justify-content:center;min-height:45px;border-radius:11px;font-size:14px;color:#82747C}
.wp-day-tabs button[aria-pressed=true]{background:#fff;color:#4B634F;box-shadow:0 2px 5px #69574A0B;font-weight:650}
.wp-day-tabs small{font-size:11px;font-weight:400}
.wp-day-heading{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px}
.wp-day-heading h3{font-size:14px;font-weight:600;margin:0}
.wp-text-button{border:0;background:none;padding:9px 0;font-size:11.5px!important;white-space:nowrap;color:#526F5C!important;min-height:40px}
.wp-period{display:flex;align-items:center;gap:12px;margin-top:4px}
.wp-period>span{font-size:12px;font-weight:600;color:#6F6158;white-space:nowrap}
.wp-period>small{font-size:11px;color:#82747C;line-height:1.5}
.wp-activity{padding:17px 18px;background:#fff;border:1px solid #F0E4DA;border-radius:20px;box-shadow:0 3px 15px #513B2803}
.wp-activity-top{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:29px;margin-top:-3px}
.wp-area{font-size:10px;font-weight:600;color:#60765F;letter-spacing:.04em}
.wp-read .wp-area{color:#947049}.wp-song .wp-area{color:#8C5A80}
.wp-swap{border:0;background:transparent;font-size:11px!important;color:#82747C!important;padding:8px 0 8px 12px;min-height:40px}
.wp-activity h4{font-family:var(--display);font-size:20px;letter-spacing:.01em;margin:4px 0 9px}
.wp-duration{font-size:12px;color:#715E59;margin:0;line-height:1.8}.wp-duration span{font-size:10px;color:#82747C;margin-left:12px}
.wp-material{font-size:12px;line-height:1.8;color:#75676B;margin:14px 0 4px;display:flex;gap:10px}
.wp-material b{font-weight:500;color:#A18B7E;white-space:nowrap}
.wp-how>summary{padding:13px 0 1px;color:#54715F;font-size:12px;min-height:40px}
.wp-how>summary::after{content:' \uFF0B';float:right}.wp-how[open]>summary::after{content:' \u2212'}
.wp-how ol{margin:15px 0;padding-left:21px;font-size:13px;line-height:1.95;color:#62545D}
.wp-how li{padding-left:4px;margin-bottom:6px}.wp-how li::marker{color:#A98B71;font-size:11px}
.wp-how blockquote{margin:14px 0;background:#F6F2EB;border-left:2px solid #D4BEA3;padding:11px 13px;font-size:13px;line-height:1.9;border-radius:0 10px 10px 0}
.wp-english{background:#EEF3EB;border-radius:12px;padding:12px 14px;margin-top:14px}
.wp-english>span{font-size:10px;color:#64795C}.wp-english p{font-family:system-ui,sans-serif;font-size:14px;line-height:1.7;color:#3D5942;margin:4px 0}.wp-english small{font-size:10px;color:#72806B}
.wp-notice{font-size:12px;line-height:1.8;color:#76666F;margin-top:16px}.wp-notice b{display:block;font-weight:500;color:#9B7C85;font-size:10px;margin-bottom:4px}
.wp-safety{font-size:10.5px;color:#94764E;line-height:1.7;margin:12px 0}
.wp-reason{border-top:1px solid var(--line);padding-top:12px;margin-top:15px;font-size:11px;color:#82747C;line-height:1.8}
.wp-reason a{display:block;color:#567360;margin-top:6px;font-size:10px}.wp-reason small{display:block;font-size:10px;margin-top:3px}
.wp-rest{display:flex;gap:17px;padding:18px;background:#F2EBE3;border-radius:15px;margin-top:5px;color:#7D6E65}
.wp-rest>span{font-size:11px;padding-top:3px}.wp-rest p{font-size:13px;line-height:1.8;margin:0}.wp-rest small{font-size:11px;color:#948174}
.wp-gentle{text-align:center;font-size:12px;color:#89766F;line-height:1.9;margin:7px 0}
.wp-copy{min-height:47px;background:#527360;border:0;border-radius:14px;color:#fff!important;font-size:13px!important;letter-spacing:.04em}
.wp-status{font-size:11px;color:#64795C;text-align:center;line-height:1.7}.wp-status:empty{display:none}

.app{
  --ink:#4A3A42; --soft:#95818A; --paper:#FFF7F0; --card:#FFFFFF;
  --plum:#8C5A80; --plum-soft:#F5E9F2;
  --teal:#3E8C87; --teal-soft:#E2F0EE;
  --sun:#F0AE3C; --sun-soft:#FDF1DC;
  --line:#F2E5E0; --wood:#CFA274;
  --display:ui-rounded,"SF Pro Rounded","Yuanti SC","Hiragino Maru Gothic ProN","PingFang SC",sans-serif;
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  font-family:var(--sans); background:var(--paper); color:var(--ink);
  min-height:100vh; max-width:520px; margin:0 auto;
  display:flex; flex-direction:column; -webkit-font-smoothing:antialiased;
}
.app *{box-sizing:border-box;}
.app button{font-family:inherit; cursor:pointer;}
/* \u72EC\u7ACB\u90E8\u7F72\u65F6\u6CA1\u6709\u5BBF\u4E3B reset\uFF0C\u6309\u94AE\u4F1A\u6389\u8FDB Safari \u7684\u9ED8\u8BA4\u84DD\u3002
   \u7528 :where() \u628A\u4F18\u5148\u7EA7\u538B\u5230 (0,1,0)\uFF0C\u8BA9\u540E\u9762 .mini / .chev \u7B49\u663E\u5F0F\u914D\u8272\u4ECD\u7136\u751F\u6548\u3002 */
.app :where(button){color:inherit;}
.app :where(button,input,textarea,select){-webkit-text-size-adjust:100%;}

.top{
  display:flex; align-items:center; justify-content:space-between;
  padding:22px 20px 16px; position:sticky; top:0; z-index:5;
  background:linear-gradient(180deg,var(--paper) 72%,rgba(255,247,240,0));
}
.eyebrow{
  font-size:12px; letter-spacing:.2em; color:var(--plum);
  display:block; margin-bottom:2px; font-weight:600;
}
.age{font-family:var(--display); font-size:32px; font-weight:700; margin:0; line-height:1.1; letter-spacing:-.01em;}
.age-u{font-size:14px; font-weight:500; color:var(--soft); margin:0 5px 0 2px;}

.top-r{display:flex; flex-direction:column; align-items:center; gap:1px;}
.sprout{overflow:visible;}
.sprout .leaf{animation:pop .38s cubic-bezier(.34,1.56,.64,1);}
.sprout .bloom{animation:pop .5s cubic-bezier(.34,1.56,.64,1); transform-origin:24px 12px;}
@keyframes pop{from{opacity:0; transform:scale(.4);} to{opacity:1; transform:scale(1);}}
.sprout-n{font-family:var(--display); font-size:13px; font-weight:700; color:var(--teal);}
.sprout-n i{font-style:normal; font-weight:500; color:var(--soft);}

.main{flex:1; padding:6px 14px 96px; display:flex; flex-direction:column; gap:12px;}
.loading{text-align:center; color:var(--soft); font-size:13px; padding:40px 0;}

.tip{
  background:var(--sun-soft); border-radius:20px; padding:15px 18px;
}
.tip-k{font-size:11px; letter-spacing:.14em; color:#B07C22; font-weight:700;}
.tip p{margin:6px 0 0; font-size:14.5px; line-height:1.7;}

.card{
  background:var(--card); border-radius:22px; padding:16px 18px;
  box-shadow:0 2px 12px rgba(74,58,66,.05);
}
.card-h{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:8px;}
.card-h h3{
  font-family:var(--display); font-size:18px; font-weight:700; margin:0;
  display:flex; align-items:center; gap:7px;
}
.ic{display:grid; place-items:center; flex:none;}
.meta{font-size:11.5px; color:var(--soft); line-height:1.5; text-align:right;}
.meta-hot{color:#C07B1E; font-weight:700;}

.row{
  display:flex; gap:12px; align-items:flex-start; width:100%;
  background:none; border:0; padding:10px 0; text-align:left;
}
.box{
  flex:none; width:23px; height:23px; border-radius:50%;
  border:2px solid var(--line); display:grid; place-items:center;
  color:#fff; transition:transform .2s cubic-bezier(.34,1.56,.64,1),background .18s,border-color .18s;
}
.box-on{background:var(--teal); border-color:var(--teal); transform:scale(1.08);}
.row-t{font-size:14.5px; line-height:1.6;}
.row-on .row-t{color:var(--soft);}
.row-t-muted{text-decoration:line-through; text-decoration-color:var(--line);}

.wins{display:flex; flex-direction:column; gap:15px;}
.win-h{display:flex; align-items:baseline; justify-content:space-between;}
.win-h b{font-size:14.5px; font-weight:700;}
.bar{position:relative; height:7px; background:var(--plum-soft); border-radius:99px; margin:8px 0 7px;}
.bar-f{height:100%; background:var(--plum); border-radius:99px; opacity:.3;}
.bar-d{
  position:absolute; top:-2px; width:11px; height:11px; border-radius:50%;
  background:var(--plum); transform:translateX(-5.5px);
  box-shadow:0 0 0 3px var(--card);
}
.win-n{margin:0; font-size:13px; color:var(--soft); line-height:1.65;}

.foot{text-align:center; font-size:12.5px; color:var(--soft); margin:2px 0 0;}

.warn{
  background:var(--sun-soft); border-radius:14px; padding:11px 14px; margin-bottom:10px;
  font-size:13px; line-height:1.65; color:#8A5F12;
}
.shelf{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:11px 0; border-bottom:1px solid var(--line);}
.shelf-l b{display:block; font-size:14.5px; font-weight:600;}
.shelf-r{display:flex; gap:6px; flex:none;}
.mini{
  font-size:12px; padding:6px 12px; border-radius:99px;
  border:0; background:var(--plum-soft); color:var(--plum); font-weight:600;
}
.mini-x{background:var(--line); color:#A8686A;}
.add{display:flex; gap:8px; margin-top:12px;}
.add input{
  flex:1; font-size:14.5px; padding:11px 15px; border-radius:99px;
  border:0; background:var(--paper); font-family:inherit; color:var(--ink);
}
.add input:focus{outline:2px solid var(--teal); outline-offset:1px;}
.note-s{font-size:12.5px; color:var(--soft); line-height:1.7; margin:13px 0 0;}
.tools-cta{display:block; margin:13px 0 0; padding:13px; text-align:center; text-decoration:none; font-family:inherit; font-size:14px; font-weight:600; color:#fff; background:var(--plum); border-radius:12px;}
.mt-block{padding:11px 0; border-bottom:1px solid var(--line);}
.mt-block:last-child{border-bottom:0;}
.mt-h{font-size:14.5px; font-weight:700; color:var(--plum); display:block;}
.mt-core{font-size:13.5px; color:var(--ink); margin:4px 0 8px; line-height:1.6;}
.mt-block .ul{color:var(--ink); font-size:13.5px; line-height:1.7; margin-top:6px;}

.q{display:flex; gap:11px; align-items:flex-start; padding:11px 0; border-bottom:1px solid var(--line);}
.chip{font-size:11.5px; padding:5px 11px; border-radius:99px; border:0; flex:none; font-weight:700;}
.st-wait{background:var(--paper); color:var(--soft);}
.st-live{background:var(--sun-soft); color:#B07C22;}
.st-done{background:var(--teal); color:#fff;}
.q-b b{font-size:14.5px; font-weight:700; display:block;}
.q-b p{margin:4px 0 0; font-size:13px; color:var(--soft); line-height:1.65;}

.quote{
  margin:13px 0 0; padding:13px 16px; background:var(--teal-soft);
  border-radius:16px; font-size:13.5px; line-height:1.75; color:#2F6B67;
}
.ul,.ol{margin:10px 0 0; padding-left:20px; font-size:14px; line-height:1.9; color:var(--soft);}

.fold-h{
  display:flex; align-items:center; gap:8px; width:100%;
  background:none; border:0; padding:0; text-align:left;
}
.fold-t{font-family:var(--display); font-size:18px; font-weight:700; flex:1;}
.chev{
  color:var(--plum); display:grid; place-items:center; transition:transform .28s cubic-bezier(.34,1.4,.64,1);
  background:var(--plum-soft); width:26px; height:26px; border-radius:50%; flex:none;
}
.chev-on{transform:rotate(180deg);}
.fold-b{margin-top:14px; animation:fade .28s ease;}
@keyframes fade{from{opacity:0; transform:translateY(-4px);} to{opacity:1; transform:none;}}

.sub{font-size:12px; letter-spacing:.1em; color:var(--plum); margin:16px 0 6px; font-weight:700;}
.sub:first-child{margin-top:0;}
.ref{padding:9px 0; border-bottom:1px solid var(--line);}
.ref b{font-size:14.5px; font-weight:700; display:block;}
.ref span{font-size:13px; color:var(--soft); line-height:1.65;}
.en{font-family:ui-rounded,"SF Pro Rounded",Georgia,serif;}

.frames{display:flex; flex-direction:column; gap:7px; margin-bottom:16px; background:var(--plum-soft); padding:14px 16px; border-radius:16px;}
.frame{display:flex; justify-content:space-between; gap:12px; font-size:13px;}
.frame b{font-weight:700; flex:none; color:var(--plum);}
.frame span{color:var(--soft); text-align:right;}

.script{margin-bottom:20px;}
.script-h{display:flex; align-items:baseline; gap:8px; margin-bottom:7px;}
.script-h b{font-size:14.5px; font-weight:700;}
.line{margin:0; padding:6px 0 6px 14px; font-size:14px; line-height:1.5; border-left:3px solid var(--teal-soft);}

.ahead{padding:11px 0; border-bottom:1px solid var(--line);}
.ahead b{font-size:14.5px; font-weight:700; color:var(--plum);}
.ahead-w{margin:5px 0 0; font-size:13.5px; line-height:1.65;}
.ahead-p{margin:5px 0 0; font-size:13px; color:var(--soft); line-height:1.65;}

.field{margin-bottom:15px;}
.field label{font-size:13px; font-weight:700; display:block; margin-bottom:6px;}
.field em{font-style:normal; font-weight:400; color:var(--soft); margin-left:6px; font-size:12px;}
.field textarea{
  width:100%; font-size:14.5px; padding:12px 15px; border-radius:16px;
  border:0; background:var(--paper); resize:vertical;
  font-family:inherit; line-height:1.65; color:var(--ink);
}
.field textarea:focus{outline:2px solid var(--teal); outline-offset:1px;}
.primary{
  width:100%; padding:14px; border-radius:99px; border:0;
  background:var(--teal); color:#fff; font-size:15px; font-weight:700;
  font-family:var(--display);
  transition:transform .18s cubic-bezier(.34,1.5,.64,1);
}
.primary:active{transform:scale(.97);}
.empty{font-size:13.5px; color:var(--soft); margin:0; line-height:1.75;}
.hist{padding:8px 0;}
.hist span{font-size:11.5px; color:var(--plum); font-weight:700;}
.hist p{margin:4px 0 0; font-size:14px; line-height:1.7; white-space:pre-wrap;}

/* \u63D2\u56FE */
.dia-tabs{display:flex; gap:6px; margin-bottom:10px;}
.dia-tabs button{
  font-size:12.5px; padding:6px 14px; border-radius:99px; border:0;
  background:var(--paper); color:var(--soft); font-weight:600; font-family:var(--display);
}
.dia-tabs .dt-on{background:var(--teal); color:#fff;}
.dia-tabs .dt-bad{background:#C98A86;}
.dia-svg{width:100%; height:auto; display:block; background:var(--paper); border-radius:16px; padding:6px 0;}
.d-ann{font-size:11px; fill:var(--soft); font-family:var(--sans); font-weight:600;}
.d-cap{font-size:10.5px; fill:var(--soft); font-family:var(--sans);}
.d-q{font-size:26px; fill:var(--plum); font-family:var(--display); font-weight:700;}
.dia-note{margin:10px 0 0; font-size:13px; line-height:1.7; color:var(--soft);}

.zones{display:grid; grid-template-columns:1fr 1fr; gap:9px;}
.zone{background:var(--paper); border-radius:16px; padding:12px 13px;}
.zone-h{display:flex; align-items:center; gap:7px; margin-bottom:6px;}
.zone-h b{font-size:14.5px; font-weight:700; font-family:var(--display);}
.zone-p{margin:0; font-size:12.5px; line-height:1.55;}
.zone-w{margin:5px 0 0; font-size:11.5px; line-height:1.5; color:var(--soft);}

/* \u65F6\u95F4\u8F74 */
.tl{margin-bottom:14px;}
.tl-rows{position:relative; display:flex; flex-direction:column; gap:7px;}
.tl-row{display:flex; align-items:center; gap:0;}
.tl-n{width:96px; flex:none; font-size:11.5px; font-weight:600; padding-right:8px;}
.tl-off{color:var(--soft); font-weight:400;}
.tl-track{flex:1; position:relative; height:9px; background:var(--paper); border-radius:99px;}
.tl-bar{position:absolute; top:0; height:9px; border-radius:99px; background:var(--teal); opacity:.55;}
.tl-bar-off{background:var(--soft); opacity:.2;}
.tl-now{
  position:absolute; top:-6px; bottom:-4px; width:2px; background:var(--plum);
  border-radius:2px; pointer-events:none;
}
.tl-now span{
  position:absolute; top:-15px; left:50%; transform:translateX(-50%);
  font-size:9.5px; font-weight:700; color:#fff; background:var(--plum);
  padding:2px 6px; border-radius:99px; white-space:nowrap; font-family:var(--display);
}
.tl-axis{position:relative; height:16px; margin:9px 0 0 96px;}
.tl-axis span{position:absolute; transform:translateX(-50%); font-size:10px; color:var(--soft);}
.wins{display:flex; flex-direction:column; gap:11px;}
.win-h{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:2px;}

/* \u6E38\u620F */
.game{display:flex; gap:11px; align-items:flex-start; padding:10px 0; border-bottom:1px solid var(--line);}
.game-i{
  flex:none; width:36px; height:36px; border-radius:12px; background:var(--teal-soft);
  display:grid; place-items:center; color:var(--teal);
}
.game b{font-size:14.5px; font-weight:700; display:block;}
.game span{font-size:13px; color:var(--soft); line-height:1.6;}

/* \u63D2\u753B */
.hero{display:flex; flex-direction:column; align-items:center; padding:2px 0 0;}
.hero img{
  width:100%; max-width:236px; height:auto; display:block;
  border-radius:24px; box-shadow:0 4px 18px rgba(74,58,66,.09);
  animation:heroIn .55s cubic-bezier(.22,1,.36,1);
}
@keyframes heroIn{from{opacity:0; transform:translateY(8px) scale(.985);} to{opacity:1; transform:none;}}
.hero-c{
  margin:11px 0 0; font-size:13px; color:var(--soft);
  font-family:var(--display); font-weight:600; letter-spacing:.02em;
}
.empty-b{display:flex; flex-direction:column; align-items:center; gap:12px;}
.empty-b img{width:150px; height:auto; border-radius:18px; opacity:.9;}
.empty-b .empty{text-align:center;}

/* \u7761\u7720 */
.sl-in{display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-bottom:12px;}
.sl-in label{display:flex; flex-direction:column; gap:5px;}
.sl-in span{font-size:12px; color:var(--soft); font-weight:600;}
.sl-in input{
  font-size:16px; padding:10px 12px; border-radius:14px; border:0;
  background:var(--paper); font-family:var(--display); font-weight:700;
  color:var(--ink); width:100%;
}
.sl-in input:focus{outline:2px solid var(--teal); outline-offset:1px;}
.sl-goal{background:var(--plum-soft); border-radius:16px; padding:12px 14px; margin-bottom:12px;}
.sl-goal b{display:block; font-size:14.5px; font-weight:700; color:var(--plum); font-family:var(--display);}
.sl-goal span{display:block; margin-top:4px; font-size:12.5px; color:var(--soft); line-height:1.6;}
.sl-chart svg{width:100%; height:46px; display:block; background:var(--paper); border-radius:12px;}
.sl-lg{display:flex; justify-content:space-between; margin-top:6px; font-size:11px; color:var(--soft);}

.sl-in3{grid-template-columns:1fr 1fr 1fr; gap:7px;}
.sl-in3 input{font-size:15px; padding:9px 8px; text-align:center;}
.sl-in span i{font-style:normal; font-weight:400; opacity:.6; margin-left:3px; font-size:10.5px;}
.sl-lat{margin:0 0 12px; font-size:12.5px; color:var(--soft); line-height:1.6;}
.sl-lat b{color:var(--ink); font-weight:700;}
.sl-lat-hot b{color:#C07B1E;}
.sl-steps{display:flex; align-items:baseline; gap:6px; margin:9px 0 8px; flex-wrap:wrap;}
.sl-steps div{font-size:11px; color:var(--soft); line-height:1.3;}
.sl-steps div+div::before{content:"\u2192"; margin-right:6px; color:var(--soft); opacity:.5;}
.sl-steps span{display:block; font-family:var(--display); font-size:16px; font-weight:700; color:var(--soft);}
.sl-step-key span{color:var(--plum); font-size:19px;}
.sl-goal p{margin:0; font-size:12.5px; color:var(--soft); line-height:1.6;}
.sl-lead{
  margin-top:10px; padding-top:9px; border-top:1px solid rgba(140,90,128,.15);
  font-size:11.5px; color:var(--soft); display:flex; align-items:center; gap:5px; flex-wrap:wrap;
}
.sl-lead input{
  width:44px; font-size:13px; font-weight:700; padding:4px 6px; border:0;
  border-radius:8px; background:var(--card); color:var(--plum); text-align:center;
  font-family:var(--display);
}

.alarm{background:#FBE9E7; border-radius:20px; padding:14px 17px;}
.alarm b{display:block; font-size:14.5px; font-weight:700; color:#A8564E; font-family:var(--display);}
.alarm p{margin:5px 0 0; font-size:13px; line-height:1.7; color:#8A4A44;}
.bk-stat{margin:0 0 10px; font-size:12.5px; color:var(--soft);}
.bk-stat b{color:#A8564E;}
.bk-btns{display:flex; gap:7px; margin-bottom:9px;}
.bk-ta{
  width:100%; font-size:11.5px; padding:10px 12px; border-radius:14px; border:0;
  background:var(--paper); resize:vertical; line-height:1.5; color:var(--soft);
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace; word-break:break-all;
}
.bk-ta:focus{outline:2px solid var(--teal); outline-offset:1px;}
.bk-msg{margin:8px 0 0; font-size:12.5px; color:var(--teal); font-weight:600;}

/* \u8865\u5242 */
.sp{display:flex; align-items:center; gap:12px; padding:9px 0;}
.sp .box{margin-top:0;}
.box-off{opacity:.35;}
.sp-b{flex:1; display:flex; align-items:baseline; gap:9px;}
.sp-b b{font-size:14.5px; font-weight:700;}
.sp-b span{font-size:12px; color:var(--soft);}
.sp-over{text-decoration:line-through; color:var(--soft);}
.sp-hot{color:#B07C22; font-weight:700;}
.sp-last{color:var(--teal); font-weight:700;}
.sp-e{display:flex; gap:5px; align-items:center; flex:none;}
.sp-e input{
  width:60px; font-size:12px; padding:5px 6px; border:0; border-radius:9px;
  background:var(--paper); color:var(--ink); font-family:inherit;
}
.sp-e input[type=date]{width:112px;}
.sp-e input[type=number]{width:44px; text-align:center;}
.sp-add{display:flex; gap:6px; margin-top:10px;}
.sp-add input{
  flex:1; font-size:14px; padding:9px 13px; border-radius:99px; border:0;
  background:var(--paper); font-family:inherit; color:var(--ink);
}
.sp-add select{
  font-size:12.5px; padding:8px 9px; border-radius:99px; border:0;
  background:var(--plum-soft); color:var(--plum); font-weight:600; font-family:inherit;
}

/* \u6863\u6848 */
.pf-row{display:grid; grid-template-columns:1fr 1fr; gap:9px;}
.pf-row2{margin-top:9px;}
.pf-c{background:var(--paper); border-radius:16px; padding:11px 13px;}
.pf-l{display:block; font-size:11px; color:var(--soft); font-weight:600; margin-bottom:3px;}
.pf-c b{font-family:var(--display); font-size:19px; font-weight:700;}
.pf-c i{font-style:normal; font-size:11.5px; color:var(--plum); font-weight:700; margin-left:5px;}
.pf-c em{font-style:normal; font-size:11px; color:var(--teal); font-weight:600; margin-left:5px;}
.pf-todo{font-size:12.5px !important; color:var(--soft); font-weight:500 !important;}
.pf-rt{font-size:12.5px !important; font-weight:600 !important; line-height:1.5;}
.pf-n{margin:10px 0 0; font-size:11.5px; color:var(--soft); line-height:1.6;}

.nav{
  position:fixed; bottom:0; left:0; right:0; max-width:520px; margin:0 auto;
  display:grid; grid-template-columns:repeat(5,1fr); gap:4px;
  background:rgba(255,247,240,.92); backdrop-filter:blur(14px);
  padding:8px 12px max(10px, env(safe-area-inset-bottom));
}
.nav button{
  background:none; border:0; padding:9px 0; font-size:13.5px; color:var(--soft);
  border-radius:99px; font-family:var(--display); font-weight:600;
  transition:background .2s,color .2s;
}
.nav .nav-on{color:var(--plum); background:var(--plum-soft); font-weight:700;}
.app :focus-visible{outline:2px solid var(--teal); outline-offset:2px; border-radius:6px;}
@media (prefers-reduced-motion:reduce){ .app *{animation:none !important; transition:none !important;} }

</script>
</body>
</html>
